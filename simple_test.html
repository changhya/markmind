<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkMind - Local Edge AI (Vanilla)</title>
    <style>
        :root {
            font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.87);
            background-color: #242424;
        }
        body { margin: 0; display: flex; justify-content: center; padding: 2rem; }
        .container { max-width: 800px; width: 100%; }
        .section { background: #333; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; }
        input[type="file"], input[type="text"] { margin-right: 1rem; padding: 0.5rem; }
        input[type="text"] { width: calc(100% - 100px); border-radius: 4px; border: 1px solid #555; background: #222; color: white; }
        button { border-radius: 8px; border: 1px solid transparent; padding: 0.6em 1.2em; background-color: #1a1a1a; color: white; cursor: pointer; }
        button:hover { border-color: #646cff; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-box { background: #222; min-height: 200px; max-height: 400px; overflow-y: auto; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .message { margin-bottom: 1rem; padding: 0.5rem; border-radius: 4px; }
        .message.user { background-color: #2b3a42; text-align: right; }
        .message.bot { background-color: #3e3e3e; text-align: left; }
        .input-box { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MarkMind - Local Edge AI</h1>
        
        <div class="section">
            <h2>1. Upload Document</h2>
            <input type="file" id="fileInput" />
            <button id="uploadBtn">Upload & Parse</button>
            <p id="uploadStatus"></p>
        </div>

        <div class="section">
            <h2>2. Chat with your Data (RAG)</h2>
            <div class="chat-box" id="chatBox"></div>
            <div class="input-box">
                <input type="text" id="queryInput" placeholder="Ask a question about the document..." />
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";

        // Upload Logic
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadStatus = document.getElementById('uploadStatus');

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            const targetDir = document.getElementById('targetDirInput').value.trim();
            
            if (!file) {
                alert("Please select a file first.");
                return;
            }

            uploadBtn.disabled = true;
            uploadStatus.textContent = "Uploading and extracting wiki pages (This may take a while)...";

            const formData = new FormData();
            formData.append("file", file);
            if (targetDir) {
                formData.append("target_wiki_dir", targetDir);
            }

            try {
                const response = await fetch(`${API_BASE}/api/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                if (response.ok) {
                    uploadStatus.textContent = `Upload Success! Wiki pages created: ${result.wiki_pages_created}`;
                } else {
                    uploadStatus.textContent = `Error: ${result.detail}`;
                }
            } catch (error) {
                uploadStatus.textContent = "Upload failed. Is backend running?";
                console.error(error);
            } finally {
                uploadBtn.disabled = false;
            }
        });

        // Chat Logic
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatBox = document.getElementById('chatBox');

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<strong>${role === 'user' ? 'You' : 'MarkMind'}:</strong> <span>${text}</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleChat() {
            const query = queryInput.value.trim();
            if (!query) return;

            appendMessage('user', query);
            queryInput.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = "Thinking...";

            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, model: "llama3" })
                });

                const result = await response.json();
                if (response.ok) {
                    appendMessage('bot', result.response);
                } else {
                    appendMessage('bot', `Error: ${result.detail}`);
                }
            } catch (error) {
                appendMessage('bot', "Error communicating with server.");
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "Send";
            }
        }

        sendBtn.addEventListener('click', handleChat);
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleChat();
        });
    </script>
</body>
</html>
